services:

  twenty-db:
    image: postgres:17
    restart: unless-stopped
    container_name: twenty_db
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty
    volumes:
      - /data/crm/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-redis:
    image: redis
    restart: unless-stopped
    container_name: twenty_redis
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: twenty_server
    expose:
      - "3000"
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://twenty:twenty@twenty-db:5432/twenty
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SIGN_UP_ENABLED: "true"
      INVITATION_TOKEN_EXPIRES_IN: "3d"
      SIGNING_KEY_ROTATION_DAYS: "30"
    volumes:
      - /data/crm/server-storage:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  rls-init:
    image: postgres:17
    restart: "no"
    depends_on:
      twenty-db:
        condition: service_healthy
    environment:
      PGHOST: twenty-db
      PGPORT: "5432"
      PGUSER: twenty
      PGDATABASE: twenty
      PGPASSWORD: twenty
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/rls-setup.sql <<'SQL'
        -- RLS generique Twenty CRM : les roles non-admin ne voient que leurs enregistrements
        WITH wm_id_field AS (
            SELECT fm.id AS id
            FROM core."fieldMetadata" fm
            JOIN core."objectMetadata" om ON om.id = fm."objectMetadataId"
            WHERE om."nameSingular" = 'workspaceMember' AND fm.name = 'id'
        ),
        core_app AS (
            SELECT om2."applicationId" AS id FROM core."objectMetadata" om2 WHERE om2."nameSingular" = 'company'
        ),
        targets AS (
            SELECT r.id AS role_id, r."workspaceId" AS workspace_id,
                   om.id AS object_metadata_id, fm.id AS field_metadata_id
            FROM core."role" r
            CROSS JOIN core."objectMetadata" om
            JOIN core."fieldMetadata" fm ON fm."objectMetadataId" = om.id AND fm.name = 'createdBy'
            WHERE r."canUpdateAllSettings" = false AND om."isSystem" = false
        )
        INSERT INTO core."rowLevelPermissionPredicate" (
            "universalIdentifier", "applicationId", id, "fieldMetadataId", "objectMetadataId",
            operand, value, "subFieldName", "workspaceMemberFieldMetadataId",
            "workspaceMemberSubFieldName", "rowLevelPermissionPredicateGroupId",
            "positionInRowLevelPermissionPredicateGroup", "workspaceId", "roleId",
            "createdAt", "updatedAt"
        )
        SELECT gen_random_uuid(), (SELECT id FROM core_app), gen_random_uuid(),
               t.field_metadata_id, t.object_metadata_id, 'IS', NULL, 'workspaceMemberId',
               (SELECT id FROM wm_id_field), NULL, NULL, NULL, t.workspace_id, t.role_id,
               now(), now()
        FROM targets t
        WHERE NOT EXISTS (
            SELECT 1 FROM core."rowLevelPermissionPredicate" p
            WHERE p."roleId" = t.role_id AND p."objectMetadataId" = t.object_metadata_id
              AND p."fieldMetadataId" = t.field_metadata_id AND p."deletedAt" IS NULL
        );
        SQL
        i=0
        while [ $$i -lt 60 ]; do
          if psql -v ON_ERROR_STOP=1 -f /tmp/rls-setup.sql; then
            echo '=== RLS setup applied successfully ==='
            exit 0
          fi
          i=$$((i+1))
          echo "Waiting for Twenty migrations (core schema)... attempt $$i/60"
          sleep 10
        done
        echo '=== RLS setup FAILED after 10 minutes of retries ==='
        exit 1

  rls-bridge:
    build:
      context: ./earshot-twenty-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: rls_bridge
    expose:
      - "8100"
    depends_on:
      twenty-server:
        condition: service_healthy
    environment:
      TWENTY_API_URL: http://twenty-server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      BRIDGE_SECRET: ${BRIDGE_SECRET:-earshot2025}
      PG_DATABASE_URL: postgresql://twenty:twenty@twenty-db:5432/twenty
      TWENTY_SERVER_CONTAINER: twenty-server
      REDIS_URL: redis://twenty-redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.https-0-rls-bridge.entryPoints=https
      - traefik.http.routers.https-0-rls-bridge.middlewares=gzip,strip-rls
      - "traefik.http.routers.https-0-rls-bridge.rule=Host(`crm.digitalstratify.co`) && PathPrefix(`/rls-bridge`)"
      - traefik.http.routers.https-0-rls-bridge.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-rls-bridge.tls=true
      - traefik.http.routers.http-0-rls-bridge.entryPoints=http
      - "traefik.http.routers.http-0-rls-bridge.rule=Host(`crm.digitalstratify.co`) && PathPrefix(`/rls-bridge`)"
      - traefik.http.routers.http-0-rls-bridge.middlewares=redirect-to-https,strip-rls
      - traefik.http.services.rls-bridge.loadbalancer.server.port=8100
      - traefik.http.middlewares.strip-rls.stripprefix.prefixes=/rls-bridge

  twenty-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: twenty_worker
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://twenty:twenty@twenty-db:5432/twenty
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - /data/crm/server-storage:/app/packages/twenty-server/.local-storage

  earshot-bridge:
    build:
      context: ./earshot-twenty-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: earshot_bridge
    ports:
      - "8100:8100"
    depends_on:
      twenty-server:
        condition: service_healthy
    environment:
      TWENTY_API_URL: http://twenty-server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      BRIDGE_SECRET: ${BRIDGE_SECRET}